<style>
  .err { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 120px 0 80px; position: relative; overflow: hidden; }
  .err__code { font-family: var(--mono); font-size: clamp(5rem, 18vw, 11rem); font-weight: 700; line-height: 1; background: var(--brand-grad); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -.04em; }
  .err h1 { font-size: clamp(1.3rem, 3vw, 2rem); margin: 10px 0 14px; }
  .err p { color: var(--text-soft); max-width: 520px; margin: 0 auto 30px; line-height: 1.85; }
  .err__actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .err__links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 42px; }
  .err__links a { font-size: .84rem; font-weight: 700; padding: 9px 16px; border-radius: 99px; border: 1px solid var(--border-strong); color: var(--text-soft); }
  .err__links a:hover { border-color: var(--brand-2); color: var(--brand-2); }
</style>

  <div class="container" style="position:relative; z-index:1">
    <div class="err__code">404</div>

  </div>
</section>
